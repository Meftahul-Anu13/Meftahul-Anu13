name: Metrics

# Generates an isometric commit-calendar SVG via lowlighter/metrics and commits
# it back to this repo so it can be embedded in README.md.
#
# Setup (do this after pushing this repo as Meftahul-Anu13/Meftahul-Anu13):
#   1. Create a classic PAT with `repo` + `read:user` scopes.
#   2. Add it as a repository secret named METRICS_TOKEN.
#   3. Uncomment the <img> line in README.md pointing at
#      ./github-metrics.isocalendar.svg
#   4. Run this workflow once manually (Actions tab > Metrics > Run workflow).

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Meftahul-Anu13
          filename: github-metrics.isocalendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
